# Shortcuts for everyday sizjobs commands, run with go-task (https://taskfile.dev).
#
#   task --list    show every task with its description
#   task dev:up    bring up the local k3d cluster, ArgoCD and the app-of-apps
#
# Tools come from .mise.toml, so run `mise install` first.
#
# Every kubectl and helm call names the k3d context explicitly, so a task
# never touches another cluster that happens to be the current context.

version: "3"

# Task normally echoes each command before running it. We turn that off and
# print a readable "==> ..." line per step instead. `task --verbose` shows
# the raw commands again when debugging.
silent: true

vars:
  CLUSTER: sizjobs
  # k3d prefixes its kubeconfig contexts with "k3d-".
  KCTX: k3d-{{.CLUSTER}}
  # Cluster definition: one server, local registry, Traefik off (a2-1).
  K3D_CONFIG: k3d/sizjobs.yaml
  # Docker container names k3d gives the server node and the registry.
  SERVER_CONTAINER: k3d-{{.CLUSTER}}-server-0
  REGISTRY_CONTAINER: registry.localhost
  # Local registry created by K3D_CONFIG. The host pushes to localhost:5000
  # (Docker allows plain HTTP to localhost with no extra setup), and a
  # mirror in the k3d config makes the same name work inside the cluster.
  REGISTRY: localhost:5000
  ARGOCD_NAMESPACE: argocd
  # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
  ARGOCD_CHART_VERSION: "10.10.5"
  ARGOCD_VALUES: platform/bootstrap/argocd-values.yaml
  # The root Application of the app-of-apps (a2-2).
  ROOT_APP: platform/root-app.yaml
  # The SeaweedFS all-in-one Service (a2-3) and the laptop port task
  # s3:forward uses. 8333 matches the in-cluster port, so URLs look alike.
  S3_SERVICE: seaweedfs-all-in-one
  S3_LOCAL_PORT: "8333"
  # Postgres (a2-4): the CloudNativePG cluster from platform/postgres, run by
  # the ArgoCD Application PG_APP. Names come from its values file, so the
  # tasks follow a rename. pg_value() in awk: print `key` from the
  # top-level `block` (stops at the next unindented line).
  PG_NAMESPACE: data
  PG_APP: postgres
  PG_VALUES: platform/postgres/values.yaml
  PG_VALUE_AWK: >-
    awk -v block="$block" -v key="$key"
    '$0 ~ "^" block ":" {f=1; next} /^[^ #]/ {f=0}
    f && $1 == key ":" {gsub(/"/, "", $2); print $2; exit}'
  PG_CLUSTER:
    sh: block=cluster key=name; {{.PG_VALUE_AWK}} platform/postgres/values.yaml
  PG_BACKUP_DEST:
    sh: |
      block=objectStore key=bucket; bucket=$({{.PG_VALUE_AWK}} platform/postgres/values.yaml)
      block=objectStore key=path; path=$({{.PG_VALUE_AWK}} platform/postgres/values.yaml)
      echo "s3://$bucket/$path"
  PG_OBJECT_STORE:
    sh: block=objectStore key=name; {{.PG_VALUE_AWK}} platform/postgres/values.yaml
  # The plugin's name as registered with the operator.
  PG_PLUGIN: barman-cloud.cloudnative-pg.io
  # For task pg:backups, which lists the bucket from a pod in the cluster.
  # Same image as platform/seaweedfs/manifests/create-buckets.yaml.
  AWS_CLI_IMAGE: amazon/aws-cli:2.38.1@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
  # Cluster security (a2-5): platform/security. The namespaces come from
  # its values file (the list under namespaces:), so the tasks follow it.
  SEC_VALUES: platform/security/values.yaml
  SEC_NAMESPACES:
    # A block scalar (|), because in a plain YAML value " #" starts a comment.
    sh: |
      awk '/^namespaces:/ {f=1; next} /^[^ #]/ {f=0} f && $1 == "-" {printf "%s ", $2}' platform/security/values.yaml
  # The namespace task sec:test and sec:psa probe: the one with real flows.
  SEC_TEST_NAMESPACE: data
  # A small shell image with nc and nslookup, for task sec:test.
  BUSYBOX_IMAGE: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
  # The LLM gateway (a3-1): LiteLLM from platform/litellm, Service litellm
  # in namespace llm. task llm:verify-image reads the pinned image from the
  # values file and the chart version from the Application.
  LLM_NAMESPACE: llm
  LLM_SERVICE: litellm
  LLM_PORT: "4000"
  LLM_VALUES: platform/litellm/values.yaml
  LLM_APP: platform/apps/templates/litellm.yaml
  LLM_CHART: ghcr.io/berriai/litellm-helm
  # LiteLLM's cosign public key, fetched from a fixed commit (a commit hash
  # cannot be moved, unlike a branch or tag), and its SHA-256 as published
  # in LiteLLM's incident post of 2026-10-21 (updated 2026-10-30). The key
  # was rotated on 2026-10-23 in commit e82a3c6 because the old one was
  # exposed; it signs v1.103.8, v1.104.6, v1.105.4, v1.106.3 and later.
  LITELLM_COSIGN_KEY_URL: https://raw.githubusercontent.com/BerriAI/litellm/e82a3c646908ba0a6ee0beddc4310d7a6cac4065/cosign.pub
  LITELLM_COSIGN_FINGERPRINT: e3fe3e08c44b16407fe0b37c43b4f8b603b3a0f4ee74c29e647bc022d762c2c0
  # For task llm:smoke: curl as a non-root image (UID 100 by default; the
  # pod runs it as 65534). 8.23.0 is from 2026-10-28.
  CURL_IMAGE: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
  BRANCH:
    sh: git rev-parse --abbrev-ref HEAD
  # Image tag: short commit, plus "-dirty" when there are uncommitted
  # changes, so a local build is never mistaken for a committed one.
  TAG:
    sh: echo "$(git rev-parse --short HEAD)$(git diff --quiet HEAD || echo -dirty)"

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list

  doctor:
    desc: Check prerequisites and print versions (mise tools, Docker, free memory, AWS login)
    vars:
      # Below this much available memory the cluster is unlikely to fit.
      MIN_AVAILABLE_MIB: 3072
      # .wslconfig should give WSL about 10GB; warn when it clearly does not.
      MIN_TOTAL_MIB: 9000
    cmds:
      - |
        failed=0
        ok()   { echo "    ok    $*"; }
        warn() { echo "    WARN  $*"; }
        bad()  { echo "    FAIL  $*"; failed=1; }
        # Prints the first line of a tool's version output, or fails if the
        # tool is not on PATH. Usage: check <binary> <version command...>
        check() {
          bin=$1; shift
          if command -v "$bin" >/dev/null 2>&1; then
            ok "$bin: $("$@" 2>&1 | head -1)"
          else
            bad "$bin not on PATH. Run 'mise install' and activate mise in your shell."
          fi
        }

        echo "==> mise and the tools pinned in .mise.toml"
        if command -v mise >/dev/null 2>&1; then
          # mise prints "new version available" notices on stderr; drop them.
          ok "mise: $(mise --version 2>/dev/null)"
          # --current: only tools in this repo's config; --missing: only
          # those not installed. Empty output means everything is there.
          missing=$(mise ls --current --missing 2>/dev/null)
          if [ -n "$missing" ]; then
            bad "pinned tools not installed, run 'mise install':"
            echo "$missing" | sed 's/^/          /'
          fi
        else
          bad "mise not found. See README, Local setup."
        fi
        check terraform  terraform version
        check kubectl    kubectl version --client
        check helm       helm version --short
        check k3d        k3d version
        check aws        aws --version
        check gh         gh --version
        check uv         uv --version
        check task       task --version
        check pre-commit pre-commit --version
        check python     python --version

        echo "==> Docker"
        if ! command -v docker >/dev/null 2>&1; then
          bad "docker not on PATH."
        # {{"{{"}} inside a Taskfile is a template; this renders the literal
        # Go template '{{"{{"}}.ServerVersion{{"}}"}}' that docker expects.
        elif server=$(docker info --format '{{"{{"}}.ServerVersion{{"}}"}}' 2>/dev/null); then
          ok "daemon running, server $server ($(docker --version))"
        else
          bad "daemon not reachable. Start Docker, and check that your user is in the docker group ('groups')."
        fi

        echo "==> Optional: pushing to registry.localhost:5000 (localhost:5000 needs none of this)"
        # Docker only speaks plain HTTP to registries in its insecure list
        # (plus IP literals in 127.0.0.0/8). IndexConfigs is that list as
        # JSON; the key appears once daemon.json names the registry.
        if docker info --format '{{"{{"}}json .RegistryConfig.IndexConfigs{{"}}"}}' 2>/dev/null \
             | grep -q '"registry.localhost:5000"'; then
          ok "registry.localhost:5000 is in Docker's insecure-registries"
        else
          warn "registry.localhost:5000 is not in Docker's insecure-registries. See README, Local cluster, Pushing an image."
        fi
        # Ask the system resolver (/etc/hosts first), like Docker does:
        # getent on Linux; macOS has no getent, dscacheutil is its equivalent.
        if [ "$(uname -s)" = Darwin ]; then
          resolved=$(dscacheutil -q host -a name registry.localhost | awk '/^ip_address:/ {print $2; exit}')
        else
          resolved=$(getent hosts registry.localhost | awk '{print $1; exit}')
        fi
        if [ "$resolved" = 127.0.0.1 ]; then
          ok "registry.localhost resolves to 127.0.0.1"
        else
          warn "registry.localhost does not resolve to 127.0.0.1. See README, Local cluster, Pushing an image."
        fi

        echo "==> Memory"
        # The cluster lives in Docker, so what counts is the memory of the
        # machine Docker runs on: WSL itself on Linux, but on macOS Docker
        # Desktop's Linux VM, whose /proc/meminfo a throwaway container
        # can read (macOS itself has no /proc).
        if [ "$(uname -s)" = Darwin ]; then
          where="Docker Desktop's VM"
          meminfo=$(docker run --rm --quiet {{.BUSYBOX_IMAGE}} cat /proc/meminfo 2>/dev/null)
        else
          where="WSL"
          meminfo=$(cat /proc/meminfo)
        fi
        # MemAvailable counts free memory plus cache the kernel can drop,
        # which is what new pods can actually get. Values are in KiB.
        total=$(echo "$meminfo" | awk '/^MemTotal:/ {print int($2 / 1024)}')
        avail=$(echo "$meminfo" | awk '/^MemAvailable:/ {print int($2 / 1024)}')
        if [ -z "$total" ]; then
          warn "could not read the memory of $where (is Docker running?)."
        elif [ "$avail" -lt {{.MIN_AVAILABLE_MIB}} ]; then
          warn "$avail MiB available of $total MiB in $where, below {{.MIN_AVAILABLE_MIB}} MiB. Stop Ollama or unused containers."
        else
          ok "$avail MiB available of $total MiB in $where"
        fi
        if [ -n "$total" ] && [ "$total" -lt {{.MIN_TOTAL_MIB}} ]; then
          if [ "$(uname -s)" = Darwin ]; then
            warn "Docker Desktop's VM has $total MiB in total. Set Memory limit to 10 GB in Docker Desktop, Settings, Resources."
          else
            warn "WSL has $total MiB in total. Set memory=10GB in %UserProfile%\\.wslconfig and run 'wsl --shutdown'."
          fi
        fi

        echo "==> AWS (profile ${AWS_PROFILE:-default}; not required for Part A)"
        # Short timeouts so doctor does not hang when offline.
        if arn=$(aws sts get-caller-identity --query Arn --output text \
                   --cli-connect-timeout 5 --cli-read-timeout 10 2>/dev/null); then
          # The ARN holds the account ID and the SSO user name. Print only
          # the role and the last 4 digits of the account, so the output is
          # safe to paste into a public issue.
          account=$(echo "$arn" | cut -d: -f5 | cut -c9-12)
          role=$(echo "$arn" | cut -d/ -f2)
          ok "logged in: role $role, account ****$account"
        else
          warn "not logged in. Run 'aws sso login' (needed for Bedrock and Part B)."
        fi

        if [ "$failed" -ne 0 ]; then
          echo "==> Some required checks failed (FAIL above)."
          exit 1
        fi
        echo "==> All required checks passed."

  # ---------------------------------------------------------------------------
  # Part A: local k3d
  # ---------------------------------------------------------------------------

  dev:up:
    desc: Bring up the cluster, install ArgoCD, point the app-of-apps at the current branch, load Secrets (safe to repeat)
    # The YAML anchor (&dev_preconditions) lets the other dev:* tasks reuse
    # this list with *dev_preconditions. Task itself never sees the anchor.
    preconditions: &dev_preconditions
      - sh: docker info >/dev/null 2>&1
        msg: "Cannot reach Docker. Start it, and check that your user is in the docker group ('groups')."
      # --current: tools in this repo's .mise.toml; --missing: only those
      # not installed. Any output means something is missing.
      - sh: command -v mise >/dev/null 2>&1 && test -z "$(mise ls --current --missing 2>/dev/null)"
        msg: "Tools pinned in .mise.toml are missing (or mise is not installed). Run 'mise install'; 'task doctor' shows details."
      - sh: command -v k3d >/dev/null 2>&1 && command -v kubectl >/dev/null 2>&1
        msg: "k3d or kubectl is not on PATH. Activate mise in your shell (README, Local setup)."
      - sh: test -f {{.K3D_CONFIG}}
        msg: "{{.K3D_CONFIG}} not found. Run task from the repo root."
    cmds:
      - task: cluster:start
      - task: argocd:install
      - task: argocd:root
      - |
        # Secrets are not in git, so ArgoCD cannot create them. Load them
        # from the local .env when there is one; skip quietly otherwise.
        if [ -f "$HOME/.config/sizjobs/.env" ]; then
          # TASK_EXE is the path of the running task binary.
          "{{.TASK_EXE}}" secrets
        else
          echo "==> No ~/.config/sizjobs/.env, skipping task secrets"
        fi
      - echo "==> Up on branch {{.BRANCH}}. kubectl context {{.KCTX}}, registry {{.REGISTRY}}."
      - echo "    ArgoCD UI    task argocd:ui      (http://localhost:8080, user admin)"
      - echo "    Apps         task argocd:status"

  dev:down:
    desc: Stop the k3d cluster, keeping its data for the next dev:up
    preconditions: *dev_preconditions
    cmds:
      - echo "==> Stopping cluster {{.CLUSTER}}. PVC data and images are kept; task dev:up starts it again."
      # `stop` only stops the containers (node and registry) and frees
      # their RAM. `k3d cluster delete` would remove them.
      - k3d cluster stop {{.CLUSTER}}
      - echo "==> Stopped."

  dev:delete:
    desc: Delete the k3d cluster (PVC data and registry images in ~/.local/share/sizjobs stay)
    # Task asks y/N before running; `task dev:delete --yes` skips the question.
    prompt: Delete cluster {{.CLUSTER}}? Everything in it is lost except PVC data and images in ~/.local/share/sizjobs.
    preconditions: *dev_preconditions
    cmds:
      - echo "==> Deleting cluster {{.CLUSTER}}"
      # Removes the node and registry containers and the k3d-sizjobs
      # context from ~/.kube/config. Host directories are never touched.
      - k3d cluster delete {{.CLUSTER}}
      - echo "==> Deleted. ~/.local/share/sizjobs is kept; task dev:up creates a fresh cluster."

  dev:status:
    desc: Show the cluster, its node, and CPU and memory use
    preconditions: *dev_preconditions
    cmds:
      - echo "==> k3d clusters"
      - k3d cluster list
      - |
        # .State.Status is "running", "exited", ... ; empty if no container.
        state=$(docker inspect -f '{{"{{"}}.State.Status{{"}}"}}' {{.SERVER_CONTAINER}} 2>/dev/null || true)
        if [ "$state" != running ]; then
          echo "==> Cluster {{.CLUSTER}} is not running (${state:-not created}). task dev:up starts it."
          exit 0
        fi
        echo "==> Nodes"
        kubectl --context {{.KCTX}} get nodes -o wide
        echo "==> Node usage (from metrics-server)"
        # metrics-server needs about a minute after a start before it has
        # numbers, so do not fail the task on that.
        kubectl --context {{.KCTX}} top nodes \
          || echo "    No metrics yet. metrics-server needs about a minute after a start."
        echo "==> k3d containers (MEM LIMIT of the node is the cluster's cap)"
        # Every k3d container, node and registry alike, has the label app=k3d.
        # --no-stream: take one sample and exit instead of a live view.
        docker stats --no-stream \
          --format 'table {{"{{"}}.Name{{"}}"}}\t{{"{{"}}.CPUPerc{{"}}"}}\t{{"{{"}}.MemUsage{{"}}"}}\t{{"{{"}}.MemPerc{{"}}"}}' \
          $(docker ps --filter label=app=k3d --format '{{"{{"}}.Names{{"}}"}}')

  cluster:start:
    internal: true
    cmds:
      - |
        # .State.Status of the server container: "running", "exited", ...
        # Empty when the container does not exist.
        state=$(docker inspect -f '{{"{{"}}.State.Status{{"}}"}}' {{.SERVER_CONTAINER}} 2>/dev/null || true)
        # `k3d cluster get` exits non-zero when the cluster does not exist.
        if ! k3d cluster get {{.CLUSTER}} >/dev/null 2>&1; then
          echo "==> Creating cluster {{.CLUSTER}} from {{.K3D_CONFIG}}"
          # Host directories mounted by the k3d config: persistent volumes
          # and registry images. Created here so Docker does not create
          # them as root.
          mkdir -p "$HOME/.local/share/sizjobs/storage" "$HOME/.local/share/sizjobs/registry"
          # Passing the name on the command line overrides metadata.name in
          # the config file, so CLUSTER here is always the real name.
          k3d cluster create {{.CLUSTER}} --config {{.K3D_CONFIG}}
        elif [ "$state" = running ]; then
          echo "==> Cluster {{.CLUSTER}} is already running"
          # The registry is a separate container; start it in case it was
          # stopped by hand. A no-op when it is running.
          docker start {{.REGISTRY_CONTAINER}} >/dev/null \
            || echo "==> WARNING: registry {{.REGISTRY_CONTAINER}} is missing. task dev:delete, then task dev:up, re-creates it."
        else
          echo "==> Cluster {{.CLUSTER}} exists but is stopped, starting it"
          # Starts the node and registry containers again, same data.
          k3d cluster start {{.CLUSTER}}
        fi
      - |
        echo "==> Waiting for the node to be Ready"
        # Right after a create the Node object may not exist yet, and
        # `kubectl wait --all` fails on zero matches, so wait for it first.
        for i in $(seq 1 60); do
          [ -n "$(kubectl --context {{.KCTX}} get nodes -o name 2>/dev/null)" ] && break
          sleep 2
        done
        kubectl --context {{.KCTX}} wait --for=condition=Ready nodes --all --timeout=180s
      - |
        echo "==> Waiting for k3s's add-ons (CoreDNS, metrics-server, local-path)"
        # Not `kubectl wait --for=condition=Available`: these Deployments
        # set maxUnavailable: 1 with one replica, so they count as
        # "Available" with zero pods ready. `rollout status` waits until
        # every replica is up.
        for d in $(kubectl --context {{.KCTX}} -n kube-system get deployments -o name); do
          kubectl --context {{.KCTX}} -n kube-system rollout status "$d" --timeout=180s
        done

  # Local S3 (a2-3): SeaweedFS in namespace data, see platform/README.md.
  # The S3 API is only reachable inside the cluster; s3:forward makes it
  # reachable on the laptop for the aws CLI and other S3 clients.

  s3:forward:
    desc: Port-forward the in-cluster S3 API (SeaweedFS) to http://localhost:{{.S3_LOCAL_PORT}} (Ctrl+C to stop)
    cmds:
      - echo "==> S3 API at http://localhost:{{.S3_LOCAL_PORT}} (svc/{{.S3_SERVICE}} in namespace data). Ctrl+C stops the port-forward."
      - echo "    List buckets and objects in another terminal  task s3:ls"
      # port-forward listens on 127.0.0.1 only, so nothing else on the
      # network can reach the store.
      - kubectl --context {{.KCTX}} -n data port-forward svc/{{.S3_SERVICE}} {{.S3_LOCAL_PORT}}:8333

  s3:ls:
    desc: List the buckets and objects in local S3 through task s3:forward (keys from ~/.config/sizjobs/.env)
    preconditions:
      # Any HTTP answer will do (S3 answers 403 without keys); curl only
      # fails when nothing listens. No -f, so a 403 counts as up.
      - sh: curl -s -o /dev/null http://localhost:{{.S3_LOCAL_PORT}}/
        msg: "Nothing on localhost:{{.S3_LOCAL_PORT}}. Run task s3:forward in another terminal first."
      - sh: test -f "$HOME/.config/sizjobs/.env"
        msg: "~/.config/sizjobs/.env not found. See .env.example."
    cmds:
      - |
        env_file="$HOME/.config/sizjobs/.env"
        # Read one key from the .env without sourcing it: sourcing would
        # run the file as shell and put every secret in the environment.
        # Strips one pair of quotes, like scripts/secrets_to_k8s.py.
        env_value() {
          sed -n "s/^[[:space:]]*\(export[[:space:]]\{1,\}\)\{0,1\}$1[[:space:]]*=[[:space:]]*//p" "$env_file" \
            | tail -n 1 | sed -e 's/[[:space:]]*$//' -e "s/^\"\(.*\)\"$/\1/" -e "s/^'\(.*\)'$/\1/"
        }
        # The keys go to aws only as environment variables, never as
        # arguments (anyone on the machine can read those with ps) and
        # never in the output.
        AWS_ACCESS_KEY_ID=$(env_value S3_ACCESS_KEY)
        AWS_SECRET_ACCESS_KEY=$(env_value S3_SECRET_KEY)
        if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
          echo "==> S3_ACCESS_KEY or S3_SECRET_KEY is empty in $env_file."
          exit 1
        fi
        export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
        # Keep a real AWS login out of this: an SSO session token or profile
        # in the shell would otherwise be sent along with the local keys.
        unset AWS_SESSION_TOKEN AWS_PROFILE
        # The region is not checked locally, but the CLI needs one to sign.
        export AWS_REGION=us-east-1 AWS_PAGER=""
        s3() { aws --endpoint-url http://localhost:{{.S3_LOCAL_PORT}} s3 "$@"; }

        echo "==> Buckets at http://localhost:{{.S3_LOCAL_PORT}}"
        buckets=$(s3 ls | awk '{print $3}')
        if [ -z "$buckets" ]; then
          echo "    (none)"
          exit 0
        fi
        echo "$buckets" | sed 's/^/    /'
        for bucket in $buckets; do
          echo "==> Objects in s3://$bucket"
          # --summarize adds object count and total size at the end.
          s3 ls "s3://$bucket" --recursive --human-readable --summarize | sed 's/^/    /'
        done

  # Postgres (a2-4): the CloudNativePG cluster in platform/postgres, with
  # backups through the Barman Cloud Plugin. README.md "Database" explains
  # the setup. These tasks read state or create Backup resources, except
  # pg:restore-drill, which deletes the cluster and restores it.
  pg:status:
    desc: Show the Postgres cluster, its last successful backup and the WAL archiving condition
    cmds:
      - |
        k() { kubectl --context {{.KCTX}} -n {{.PG_NAMESPACE}} "$@"; }
        cl={{.PG_CLUSTER}}
        # The full resource name: plain "cluster" could match another CRD.
        if ! k get clusters.postgresql.cnpg.io "$cl" >/dev/null 2>&1; then
          echo "==> No Cluster $cl in namespace {{.PG_NAMESPACE}}. task argocd:status shows whether the postgres app has synced."
          exit 1
        fi
        echo "==> Cluster $cl in namespace {{.PG_NAMESPACE}}"
        k get clusters.postgresql.cnpg.io "$cl" \
          -o custom-columns='NAME:.metadata.name,PHASE:.status.phase,READY:.status.readyInstances,INSTANCES:.status.instances,PRIMARY:.status.currentPrimary,ARCHIVES TO:.spec.plugins[0].parameters.serverName' \
          | sed 's/^/    /'

        echo "==> WAL archiving (condition ContinuousArchiving)"
        # A jsonpath filter: the one condition whose type matches.
        cond='{.status.conditions[?(@.type=="ContinuousArchiving")]'
        status=$(k get clusters.postgresql.cnpg.io "$cl" -o jsonpath="$cond.status}")
        reason=$(k get clusters.postgresql.cnpg.io "$cl" -o jsonpath="$cond.reason}")
        message=$(k get clusters.postgresql.cnpg.io "$cl" -o jsonpath="$cond.message}")
        echo "    ${status:-Unknown} ${reason:-} ${message:-}"

        echo "==> Last successful backup"
        server=$(k get clusters.postgresql.cnpg.io "$cl" -o jsonpath='{.spec.plugins[0].parameters.serverName}')
        # The plugin records, per serverName, the newest completed base
        # backup in the object store and the oldest point it can restore to.
        window="{.status.serverRecoveryWindow['$server']"
        last=$(k get objectstores.barmancloud.cnpg.io {{.PG_OBJECT_STORE}} -o jsonpath="$window.lastSuccessfulBackupTime}" 2>/dev/null || true)
        first=$(k get objectstores.barmancloud.cnpg.io {{.PG_OBJECT_STORE}} -o jsonpath="$window.firstRecoverabilityPoint}" 2>/dev/null || true)
        echo "    generation $server: last base backup ${last:-none yet}, restorable back to ${first:-n/a}"
        echo "==> Newest Backup resources (task pg:backups lists what is in the bucket)"
        backups=$(k get backups.postgresql.cnpg.io --sort-by=.metadata.creationTimestamp \
          -o custom-columns='NAME:.metadata.name,PHASE:.status.phase,BACKUP ID:.status.backupId,STARTED:.status.startedAt,STOPPED:.status.stoppedAt' 2>/dev/null || true)
        if [ "$(echo "$backups" | wc -l)" -le 1 ]; then
          echo "    (none)"
        else
          # The header, then the five newest.
          { echo "$backups" | head -1; echo "$backups" | tail -n +2 | tail -5; } | sed 's/^/    /'
        fi
        if command -v kubectl-cnpg >/dev/null 2>&1; then
          echo "==> kubectl cnpg status"
          # kubectl hands everything after the plugin name to the plugin and
          # rejects flags before it, so --context goes last.
          kubectl cnpg status "$cl" -n {{.PG_NAMESPACE}} --context {{.KCTX}}
        else
          echo "==> More detail: install the kubectl cnpg plugin (README.md, Database), then kubectl cnpg status $cl -n {{.PG_NAMESPACE}}"
        fi

  pg:psql:
    desc: "Open psql on the primary as postgres (DB=agent for another database; psql arguments after --)"
    vars:
      DB: '{{.DB | default "postgres"}}'
    cmds:
      - |
        primary=$(kubectl --context {{.KCTX}} -n {{.PG_NAMESPACE}} get clusters.postgresql.cnpg.io {{.PG_CLUSTER}} \
                    -o jsonpath='{.status.currentPrimary}' 2>/dev/null || true)
        if [ -z "$primary" ]; then
          echo "==> Cluster {{.PG_CLUSTER}} has no primary. task pg:status shows why."
          exit 1
        fi
        echo "==> psql on $primary (primary of {{.PG_CLUSTER}}), database {{.DB}}, as postgres" >&2
        # -i passes stdin through; -t gives psql a terminal (prompt, line
        # editing) only when there is one, so piping SQL in works too.
        # In the pod psql uses the local socket, where the postgres OS user
        # logs in as the postgres superuser (peer authentication): no
        # password, and no superuser login over the network.
        tty=""; [ -t 0 ] && tty=-t
        kubectl --context {{.KCTX}} -n {{.PG_NAMESPACE}} exec -i $tty "$primary" -c postgres -- \
          psql -d {{.DB}} {{.CLI_ARGS}}

  pg:backup:
    desc: Take an on-demand base backup through the Barman Cloud Plugin and wait until it completes
    cmds:
      - |
        k() { kubectl --context {{.KCTX}} -n {{.PG_NAMESPACE}} "$@"; }
        name="{{.PG_CLUSTER}}-manual-$(date -u +%Y%m%d-%H%M%S)"
        server=$(k get clusters.postgresql.cnpg.io {{.PG_CLUSTER}} -o jsonpath='{.spec.plugins[0].parameters.serverName}')
        echo "==> Creating Backup $name (method plugin, into generation $server)"
        # A Backup resource is a one-off request that CNPG and the plugin's
        # sidecar carry out. Made here, not by ArgoCD (which ignores it),
        # and labelled so these are easy to find and clean up.
        k create -f - >/dev/null <<EOF
        apiVersion: postgresql.cnpg.io/v1
        kind: Backup
        metadata:
          name: $name
          labels:
            app.kubernetes.io/managed-by: sizjobs-task-pg-backup
        spec:
          cluster:
            name: {{.PG_CLUSTER}}
          method: plugin
          pluginConfiguration:
            name: {{.PG_PLUGIN}}
          # Ask Postgres for an immediate checkpoint at the start. The
          # default spreads it over minutes (checkpoint_completion_target)
          # to spare I/O, which suits 02:00 but not someone waiting.
          online: true
          onlineConfiguration:
            immediateCheckpoint: true
        EOF
        echo "==> Waiting for $name to complete (up to 10 minutes)"
        seen=""
        for i in $(seq 1 200); do
          phase=$(k get backups.postgresql.cnpg.io "$name" -o jsonpath='{.status.phase}')
          # Print each phase once as it changes.
          if [ -n "$phase" ] && [ "$phase" != "$seen" ]; then
            echo "    phase: $phase"
            seen=$phase
          fi
          case "$phase" in
            completed)
              k get backups.postgresql.cnpg.io "$name" \
                -o jsonpath='    backup ID {.status.backupId}, WAL {.status.beginWal} to {.status.endWal}, {.status.startedAt} to {.status.stoppedAt}{"\n"}'
              echo "==> Backup $name completed."
              exit 0 ;;
            failed)
              echo "==> Backup $name failed: $(k get backups.postgresql.cnpg.io "$name" -o jsonpath='{.status.error}')"
              echo "    Sidecar logs: kubectl --context {{.KCTX}} -n {{.PG_NAMESPACE}} logs {{.PG_CLUSTER}}-1 -c plugin-barman-cloud --tail=50"
              exit 1 ;;
          esac
          sleep 3
        done
        echo "==> Backup $name did not finish within 10 minutes (last phase: ${seen:-none})."
        exit 1

  pg:backups:
    desc: List the base backups and WAL in the backup bucket, per generation (serverName)
    cmds:
      - |
        k() { kubectl --context {{.KCTX}} -n {{.PG_NAMESPACE}} "$@"; }
        pod="pg-backups-ls-$(date +%s)"
        echo "==> Listing {{.PG_BACKUP_DEST}} from a short-lived pod ($pod) in namespace {{.PG_NAMESPACE}}"
        # The pod reads the endpoint and keys from s3-config and the s3
        # Secret, as CNPG does, so no keys reach the laptop and no
        # port-forward is needed. It is deleted on exit, also on Ctrl+C.
        trap 'k delete pod "$pod" --ignore-not-found --wait=false >/dev/null 2>&1' EXIT
        # Quoted 'EOF': the shell leaves the pod's script alone ($base etc.
        # are the pod's variables); sed fills in the pod name.
        sed "s/POD_NAME/$pod/" <<'EOF' | k create -f - >/dev/null
        apiVersion: v1
        kind: Pod
        metadata:
          name: POD_NAME
          labels:
            app.kubernetes.io/managed-by: sizjobs-task-pg-backups
            # The NetworkPolicy pg-backups-ls (platform/security) selects
            # this pod by name and lets it reach the S3 API.
            app.kubernetes.io/name: pg-backups-ls
        spec:
          restartPolicy: Never
          # Killed after 2 minutes, so a stuck pod never lingers.
          activeDeadlineSeconds: 120
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: aws
              image: {{.AWS_CLI_IMAGE}}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  base="{{.PG_BACKUP_DEST}}"
                  # Folders right under base are generations (serverName).
                  servers=$(aws s3 ls "$base/" | awk '$1 == "PRE" {sub("/$", "", $2); print $2}')
                  if [ -z "$servers" ]; then
                    echo "    (no backups yet)"
                    exit 0
                  fi
                  for srv in $servers; do
                    echo "==> generation (serverName) $srv"
                    # A base backup is a folder named by its backup ID, with
                    # backup.info (key=value lines) and the compressed data.
                    ids=$(aws s3 ls "$base/$srv/base/" 2>/dev/null | awk '$1 == "PRE" {sub("/$", "", $2); print $2}' || true)
                    [ -z "$ids" ] && echo "    base backups: none"
                    for id in $ids; do
                      info=$(aws s3 cp "$base/$srv/base/$id/backup.info" - 2>/dev/null || true)
                      field() { echo "$info" | sed -n "s/^$1=//p"; }
                      # Bytes stored in the bucket for this backup (compressed).
                      mib=$(aws s3 ls "$base/$srv/base/$id/" --recursive --summarize \
                              | awk '/Total Size:/ {printf "%.1f", $3 / 1048576}')
                      echo "    base $id  $(field status)  ended $(field end_time)  $mib MiB  WAL $(field begin_wal) to $(field end_wal)"
                    done
                    # --summarize ends with "Total Objects: N" and "Total Size: B".
                    aws s3 ls "$base/$srv/wals/" --recursive --summarize 2>/dev/null \
                      | awk '/Total Objects:/ {n = $3} /Total Size:/ {s = $3}
                             END {printf "    WAL files: %d (%.1f MiB)\n", n, s / 1048576}'
                  done
              env:
                - name: AWS_ENDPOINT_URL
                  valueFrom:
                    configMapKeyRef:
                      name: s3-config
                      key: S3_ENDPOINT
                - name: AWS_REGION
                  valueFrom:
                    configMapKeyRef:
                      name: s3-config
                      key: S3_REGION
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3
                      key: S3_ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3
                      key: S3_SECRET_KEY
                # The CLI writes a cache under $HOME; only /tmp is writable.
                - name: HOME
                  value: /tmp
                - name: AWS_PAGER
                  value: ""
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
        EOF
        # Wait for the pod to finish, then print its output.
        for i in $(seq 1 60); do
          phase=$(k get pod "$pod" -o jsonpath='{.status.phase}' 2>/dev/null || true)
          case "$phase" in Succeeded|Failed) break ;; esac
          sleep 2
        done
        k logs "$pod"
        if [ "$phase" != Succeeded ]; then
          echo "==> Listing failed (pod phase ${phase:-unknown})."
          exit 1
        fi

  pg:restore-drill:
    desc: "Restore drill: canary rows, backup, delete the cluster and its PVC, restore it in the next generation through git and ArgoCD, check the rows (PASS/FAIL)"
    # Task asks y/N before anything runs; `task pg:restore-drill --yes`
    # answers yes. Nothing is deleted before the backup and the WAL archive
    # are confirmed good, and the drill stops instead if they are not.
    prompt: >-
      The drill writes two canary rows, takes a backup, then DELETES Cluster {{.PG_CLUSTER}} and its PVC,
      commits and pushes a generation bump of {{.PG_VALUES}} to branch {{.BRANCH}},
      and lets ArgoCD restore the cluster from the backup. Continue?
    preconditions:
      - sh: test "{{.BRANCH}}" != main && test "{{.BRANCH}}" != HEAD
        msg: "The drill commits and pushes a generation bump. Run it on a branch that ArgoCD tracks (git switch -c <branch>, push it, task dev:up), not on main."
      - sh: >-
          test "$(kubectl --context {{.KCTX}} -n {{.ARGOCD_NAMESPACE}} get applications.argoproj.io root
          -o jsonpath='{.spec.source.targetRevision}')" = "{{.BRANCH}}"
        msg: "ArgoCD does not track branch {{.BRANCH}}. Run task dev:up on this branch first."
      - sh: git diff --quiet HEAD -- {{.PG_VALUES}}
        msg: "{{.PG_VALUES}} has uncommitted changes. The drill commits that file; commit or stash your changes first."
      - sh: test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/{{.BRANCH}} | cut -f1)"
        msg: "HEAD is not what origin/{{.BRANCH}} points to. Push (or pull) first, so the drill's push holds only its own commit."
    cmds:
      - |
        set -eu
        k() { kubectl --context {{.KCTX}} "$@"; }
        ns={{.PG_NAMESPACE}}
        cl={{.PG_CLUSTER}}
        app={{.PG_APP}}
        values={{.PG_VALUES}}
        cluster() { k -n "$ns" get clusters.postgresql.cnpg.io "$cl" "$@"; }
        # psql on the primary, unaligned output without headers (-At), and
        # stop at the first error (ON_ERROR_STOP).
        sql() {
          primary=$(cluster -o jsonpath='{.status.currentPrimary}')
          k -n "$ns" exec "$primary" -c postgres -- psql -v ON_ERROR_STOP=1 -qAt -d postgres -c "$1"
        }
        condition() { cluster -o jsonpath="{.status.conditions[?(@.type==\"$1\")].status}" 2>/dev/null || true; }

        # Generations: archiveTo jobs-gN becomes restoreFrom, and the
        # cluster archives into jobs-gN+1 from now on.
        block=bootstrap key=archiveTo; current=$({{.PG_VALUE_AWK}} "$values")
        case "$current" in
          *-g[0-9]*) ;;
          *) echo "==> bootstrap.archiveTo in $values is '$current', expected a name ending in -g<number>."; exit 1 ;;
        esac
        n=${current##*-g}
        next="${current%-g*}-g$((n + 1))"
        echo "==> Restore drill on cluster $cl: restore from $current, archive to $next afterwards"

        echo "==> [1/8] Checking that $cl is Ready and archiving WAL"
        if [ "$(condition Ready)" != True ] || [ "$(condition ContinuousArchiving)" != True ]; then
          echo "==> FAIL: $cl must be Ready with ContinuousArchiving True before a drill. task pg:status shows why it is not."
          exit 1
        fi
        echo "    Ready, ContinuousArchiving True"

        token="drill-$(date -u +%Y%m%dT%H%M%SZ)"
        echo "==> [2/8] Writing canary row 1 ($token, base-backup): it must come back from the base backup"
        sql "CREATE TABLE IF NOT EXISTS restore_drill (token text, phase text, written_at timestamptz DEFAULT now(), PRIMARY KEY (token, phase))"
        sql "INSERT INTO restore_drill (token, phase) VALUES ('$token', 'base-backup')"

        echo "==> [3/8] Taking a base backup"
        "{{.TASK_EXE}}" pg:backup

        echo "==> [4/8] Writing canary row 2 ($token, wal): written after the backup, so only WAL replay can bring it back"
        sql "INSERT INTO restore_drill (token, phase) VALUES ('$token', 'wal')"
        # Close the current WAL segment now instead of when it fills up
        # (16MB) or at archive_timeout, so it is archived right away.
        wal=$(sql "SELECT pg_walfile_name(pg_current_wal_lsn())")
        sql "SELECT pg_switch_wal()" >/dev/null
        echo "    waiting for WAL segment $wal to be archived"
        for i in $(seq 1 60); do
          last=$(sql "SELECT coalesce(last_archived_wal, '') FROM pg_stat_archiver")
          # WAL file names sort in write order; a later one means ours is in.
          if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$wal" "$last" | sort | tail -1)" = "$last" ]; then
            break
          fi
          sleep 2
        done
        if [ "$(printf '%s\n%s\n' "$wal" "$last" | sort | tail -1)" != "$last" ]; then
          echo "==> FAIL: $wal was not archived within 2 minutes (last archived: ${last:-none}). Nothing was deleted."
          exit 1
        fi
        echo "    archived (last archived WAL: $last)"

        echo "==> [5/8] Pausing ArgoCD for app $app, so it does not recreate $cl from the old values"
        # skip-reconcile makes the controller leave the Application alone.
        # An annotation, not a spec change, so the root app's selfHeal does
        # not undo it.
        k -n {{.ARGOCD_NAMESPACE}} annotate applications.argoproj.io "$app" argocd.argoproj.io/skip-reconcile=true --overwrite >/dev/null
        deleted=no
        # If anything fails before the delete, resume ArgoCD; after it,
        # keep it paused (resuming would recreate an empty cluster) and say
        # how to continue.
        resume() {
          k -n {{.ARGOCD_NAMESPACE}} annotate applications.argoproj.io "$app" \
            argocd.argoproj.io/skip-reconcile- argocd.argoproj.io/refresh=hard --overwrite >/dev/null
        }
        on_exit() {
          status=$?
          [ "$status" -eq 0 ] && return
          if [ "$deleted" = no ]; then
            echo "==> Stopped before deleting anything; resuming ArgoCD for $app."
            resume
          elif [ "$deleted" = yes ]; then
            echo "==> Stopped after deleting $cl. ArgoCD is still paused for $app."
            echo "    Finish by hand: README.md, Database, Bumping the generation; then"
            echo "    kubectl --context {{.KCTX}} -n {{.ARGOCD_NAMESPACE}} annotate applications.argoproj.io $app argocd.argoproj.io/skip-reconcile- argocd.argoproj.io/refresh=hard"
          fi
        }
        trap on_exit EXIT

        echo "==> [6/8] Deleting Cluster $cl and its PVC"
        deleted=yes
        k -n "$ns" delete clusters.postgresql.cnpg.io "$cl" --wait=true --timeout=3m
        # The PVC has an owner reference to the Cluster, so Kubernetes
        # deletes it too; delete it explicitly anyway and wait, so no old
        # data can be picked up by the new cluster.
        k -n "$ns" delete pvc -l cnpg.io/cluster="$cl" --ignore-not-found --wait=true --timeout=2m
        for i in $(seq 1 60); do
          [ -z "$(k -n "$ns" get pods,pvc -l cnpg.io/cluster="$cl" -o name 2>/dev/null)" ] && break
          sleep 2
        done
        echo "    gone: no pods or PVCs left with label cnpg.io/cluster=$cl"

        echo "==> [7/8] Bumping the generation in $values (recovery from $current, archive to $next); commit and push"
        # Rewrite the three bootstrap keys, only inside the bootstrap block.
        tmp=$(mktemp)
        awk -v from="$current" -v to="$next" '
          /^bootstrap:/ {f = 1; print; next}
          /^[^ #]/ {f = 0}
          f && $1 == "mode:" {print "  mode: recovery"; next}
          f && $1 == "restoreFrom:" {print "  restoreFrom: " from; next}
          f && $1 == "archiveTo:" {print "  archiveTo: " to; next}
          {print}' "$values" > "$tmp"
        cat "$tmp" > "$values"
        rm -f "$tmp"
        git --no-pager diff -- "$values"
        # `git commit -- <file>` commits only that file, whatever else is
        # staged. The pre-commit hooks run as usual.
        git commit --quiet -m "pg: restore drill, archive generation $current -> $next" -- "$values"
        git push --quiet origin "{{.BRANCH}}"
        deleted=pushed
        echo "    pushed $(git rev-parse --short HEAD) to origin/{{.BRANCH}}"
        echo "    resuming ArgoCD for $app with a hard refresh, so it reads the new commit before it syncs"
        resume

        echo "==> [8/8] Waiting for ArgoCD to create $cl in recovery mode, and for the restore to finish"
        for i in $(seq 1 90); do
          cluster >/dev/null 2>&1 && break
          sleep 2
        done
        source_server=$(cluster -o jsonpath='{.spec.externalClusters[0].plugin.parameters.serverName}')
        archive_server=$(cluster -o jsonpath='{.spec.plugins[0].parameters.serverName}')
        echo "    created: restores from ${source_server:-nothing (initdb!)}, archives to ${archive_server:-?}"
        # A full recovery downloads the base backup and replays WAL in a Job,
        # then starts the instance; minutes, not seconds.
        k -n "$ns" wait --for=condition=Ready clusters.postgresql.cnpg.io "$cl" --timeout=15m
        rows=$(sql "SELECT string_agg(phase, ',' ORDER BY phase) FROM restore_drill WHERE token = '$token'" || true)
        echo "    canary rows found for $token: ${rows:-none}"
        echo "    waiting for WAL archiving into $next"
        for i in $(seq 1 60); do
          [ "$(condition ContinuousArchiving)" = True ] && break
          sleep 3
        done
        archiving=$(condition ContinuousArchiving)

        result=PASS
        check() { if [ "$2" = "$3" ]; then echo "    ok    $1"; else echo "    FAIL  $1 (got '$2', want '$3')"; result=FAIL; fi; }
        echo "==> Checks"
        check "restored from generation $current" "$source_server" "$current"
        check "archives to generation $next" "$archive_server" "$next"
        check "canary rows (base backup and WAL)" "$rows" "base-backup,wal"
        check "ContinuousArchiving" "$archiving" True
        if [ "$result" = PASS ]; then
          echo "==> Taking a base backup in the new generation $next, so it does not depend on $current's WAL"
          "{{.TASK_EXE}}" pg:backup
        fi
        echo "==> Restore drill: $result"
        [ "$result" = PASS ]

  # Cluster security (a2-5): Pod Security "restricted" and default-deny
  # NetworkPolicies in the application namespaces, from platform/security.
  # README.md "Cluster security" explains both layers. These tasks only
  # read state or create short-lived pods that they delete again.
  sec:status:
    desc: Show the Pod Security labels and the NetworkPolicies of each application namespace
    cmds:
      - |
        k() { kubectl --context {{.KCTX}} "$@"; }
        for ns in {{.SEC_NAMESPACES}}; do
          echo "==> Namespace $ns"
          if ! k get namespace "$ns" >/dev/null 2>&1; then
            echo "    MISSING. task argocd:status shows whether the security app has synced."
            continue
          fi
          echo "    Pod Security labels:"
          # The labels as a JSON map ({"a":"b",...}), one per line, keeping
          # only the Pod Security ones.
          k get namespace "$ns" -o jsonpath='{.metadata.labels}' | tr -d '{}"' | tr ',' '\n' \
            | grep '^pod-security' | sed 's/:/=/; s/^/      /' || echo "      (none)"
          echo "    NetworkPolicies:"
          k -n "$ns" get networkpolicies -o custom-columns='NAME:.metadata.name,POD-SELECTOR:.spec.podSelector,TYPES:.spec.policyTypes' 2>/dev/null \
            | sed 's/^/      /' | grep . || echo "      (none)"
        done

        # The API server allow rule is an ipBlock (kubeAPI.cidr). Docker
        # picks the k3d network's subnet when the cluster is created, so a
        # re-created cluster can land outside it; then CNPG loses the API.
        block=kubeAPI key=cidr; cidr=$({{.PG_VALUE_AWK}} {{.SEC_VALUES}})
        node_ip=$(k get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
        echo "==> API server allow rule: kubeAPI.cidr $cidr, node InternalIP $node_ip"
        # IPv4 to a number, then compare the network parts.
        in_cidr=$(awk -v ip="$node_ip" -v cidr="$cidr" 'BEGIN {
          split(cidr, c, "/"); split(c[1], n, "."); split(ip, a, ".")
          net = ((n[1] * 256 + n[2]) * 256 + n[3]) * 256 + n[4]
          adr = ((a[1] * 256 + a[2]) * 256 + a[3]) * 256 + a[4]
          size = 2 ^ (32 - c[2])
          print (int(net / size) == int(adr / size)) ? "yes" : "no" }')
        if [ "$in_cidr" = yes ]; then
          echo "    ok: the node is inside the allowed range"
        else
          echo "    WARNING: the node is outside $cidr. Set kubeAPI.cidr in {{.SEC_VALUES}} to the k3d network:"
          echo "    the Subnet in: docker network inspect k3d-{{.CLUSTER}}"
        fi

  sec:psa:
    desc: "Pod Security test: try to create a privileged pod in data and confirm admission rejects it (PASS/FAIL)"
    cmds:
      - |
        k() { kubectl --context {{.KCTX}} -n {{.SEC_TEST_NAMESPACE}} "$@"; }
        ns={{.SEC_TEST_NAMESPACE}}
        pod="sec-psa-$(date +%s)"
        level=$(kubectl --context {{.KCTX}} get namespace "$ns" -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}')
        echo "==> Namespace $ns enforces Pod Security level: ${level:-none}"
        echo "==> Creating privileged pod $pod (privileged: true, root): admission must reject it"
        # A real create, not a dry run. If it is wrongly admitted, the trap
        # deletes it again; the image is never pulled in the normal case.
        trap 'k delete pod "$pod" --ignore-not-found --wait=false >/dev/null 2>&1' EXIT
        # Task's shell stops at the first failing command, and the expected
        # outcome here is a failing create; "&& ... || ..." keeps its exit
        # status instead of stopping.
        out=$(sed "s/POD_NAME/$pod/" <<'EOF' | k create -f - 2>&1
        apiVersion: v1
        kind: Pod
        metadata:
          name: POD_NAME
          labels:
            app.kubernetes.io/name: sec-psa
            app.kubernetes.io/managed-by: sizjobs-task-sec-psa
        spec:
          restartPolicy: Never
          activeDeadlineSeconds: 30
          containers:
            - name: privileged
              image: {{.BUSYBOX_IMAGE}}
              command: ["sleep", "30"]
              securityContext:
                privileged: true
              resources:
                limits:
                  memory: 16Mi
        EOF
        ) && status=0 || status=$?
        echo "$out" | sed 's/^/    /'
        if [ "$status" -eq 0 ]; then
          echo "==> FAIL: the privileged pod was admitted (deleting it now)"
          exit 1
        fi
        # PSA's own wording, so a rejection for another reason (a typo, a
        # missing namespace) does not count as a pass.
        if echo "$out" | grep -q 'violates PodSecurity "restricted'; then
          echo "==> PASS: Pod Security admission rejected the privileged pod"
        else
          echo "==> FAIL: the pod was rejected, but not by Pod Security (see above)"
          exit 1
        fi

  sec:test:
    desc: "NetworkPolicy test: from a pod with no allow policy, Postgres, S3 and the internet must be blocked and DNS must work (PASS/FAIL)"
    cmds:
      - |
        k() { kubectl --context {{.KCTX}} -n {{.SEC_TEST_NAMESPACE}} "$@"; }
        ns={{.SEC_TEST_NAMESPACE}}
        pod="sec-test-$(date +%s)"
        pg_host="{{.PG_CLUSTER}}-rw.$ns.svc.cluster.local"
        s3_host="{{.S3_SERVICE}}.$ns.svc.cluster.local"
        external_host=example.com
        echo "==> Starting test pod $pod in namespace $ns"
        echo "    Its label app.kubernetes.io/name=sec-test matches no allow policy, so only"
        echo "    default-deny-all and allow-dns (which select every pod) apply to it."
        trap 'echo "==> Deleting test pod $pod"; k delete pod "$pod" --ignore-not-found --wait=false >/dev/null 2>&1' EXIT
        # Built to pass Pod Security "restricted": non-root (65534, the
        # conventional "nobody"), no privilege escalation, no capabilities,
        # the runtime's default seccomp profile, read-only root filesystem.
        sed "s/POD_NAME/$pod/" <<'EOF' | k create -f - >/dev/null
        apiVersion: v1
        kind: Pod
        metadata:
          name: POD_NAME
          labels:
            app.kubernetes.io/name: sec-test
            app.kubernetes.io/managed-by: sizjobs-task-sec-test
        spec:
          restartPolicy: Never
          # Killed after 3 minutes, so a stuck pod never lingers.
          activeDeadlineSeconds: 180
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: probe
              image: {{.BUSYBOX_IMAGE}}
              command: ["sleep", "170"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
        EOF
        k wait --for=condition=Ready pod/"$pod" --timeout=90s >/dev/null

        result=PASS
        report() { printf '    %-4s  %s\n' "$1" "$2"; [ "$1" = PASS ] || result=FAIL; }
        # kubectl exec itself must work, or every "blocked" below would pass
        # for the wrong reason.
        if ! k exec "$pod" -- true; then
          echo "==> FAIL: cannot exec into $pod"
          exit 1
        fi

        # The targets must be up, or a blocked connection proves nothing.
        echo "==> Checking that the targets have ready endpoints"
        for svc in {{.PG_CLUSTER}}-rw {{.S3_SERVICE}}; do
          addrs=$(k get endpointslices -l kubernetes.io/service-name="$svc" \
                    -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[*]}')
          if [ -n "$addrs" ]; then report PASS "service $svc is up ($addrs)"; else report FAIL "service $svc has no ready endpoint"; fi
        done

        echo "==> Connections that must be BLOCKED (3s timeout each)"
        # nc -z: connect only, send nothing; -w 3: give up after 3 seconds.
        # Exit 0 means the TCP connection was made.
        blocked() {
          if k exec "$pod" -- nc -z -w 3 "$2" "$3" 2>/dev/null; then
            report FAIL "$1 $2:$3 connected"
          else
            report PASS "$1 $2:$3 blocked"
          fi
        }
        blocked "Postgres" "$pg_host" 5432
        # 8333: the S3 port inside the cluster (S3_LOCAL_PORT is the laptop's).
        blocked "S3 API  " "$s3_host" 8333
        blocked "internet" "$external_host" 443

        echo "==> DNS lookups that must WORK"
        # busybox nslookup prints the server first ("Server:", "Address:"),
        # then one "Name:"/"Address:" pair per answer. Only answers count.
        resolves() {
          out=$(k exec "$pod" -- nslookup "$1" 2>&1)
          addr=$(echo "$out" | awk '/^Name:/ {getline; print $NF; exit}')
          if [ -n "$addr" ]; then report PASS "$1 resolves ($addr)"; else report FAIL "$1 does not resolve"; echo "$out" | sed 's/^/          /'; fi
        }
        resolves "$pg_host"
        resolves "$external_host"

        echo "==> NetworkPolicy test: $result"
        [ "$result" = PASS ]

  # ArgoCD bootstrap (a2-2). Helm installs ArgoCD itself; after that,
  # everything in the cluster comes from git through the root Application.
  # See docs/adr/0002-local-argocd-bootstrap.md.
  argocd:install:
    internal: true
    cmds:
      - echo "==> Installing or upgrading ArgoCD (Helm chart argo-cd {{.ARGOCD_CHART_VERSION}}) in namespace {{.ARGOCD_NAMESPACE}}"
      # upgrade --install: installs the first time, upgrades in place after,
      #   so dev:up can be run any number of times.
      # --wait: Helm 4 waits only for hooks by default; bare --wait waits
      #   until every Deployment is ready (the "watcher" strategy).
      # --history-max 3: each dev:up adds a Helm revision, stored as a
      #   Secret in the cluster; keep only the last three.
      # --hide-notes: the chart's notes describe the HTTPS port-forward;
      #   we serve HTTP, so they would only mislead. task argocd:ui instead.
      - >-
        helm upgrade --install argocd argo-cd
        --repo https://argoproj.github.io/argo-helm
        --version {{.ARGOCD_CHART_VERSION}}
        --kube-context {{.KCTX}}
        --namespace {{.ARGOCD_NAMESPACE}} --create-namespace
        --values {{.ARGOCD_VALUES}}
        --history-max 3
        --hide-notes
        --wait --timeout 5m

  argocd:root:
    internal: true
    preconditions:
      - sh: test "{{.BRANCH}}" != "HEAD"
        msg: "Detached HEAD. Check out a branch: ArgoCD tracks a branch, not a commit."
    cmds:
      - |
        # ArgoCD clones from GitHub, not from this working copy, so it only
        # sees what is pushed. ls-remote asks origin directly (no fetch);
        # the first field of its output is the commit the branch points to.
        remote=$(git ls-remote --heads origin refs/heads/{{.BRANCH}} | cut -f1)
        if [ -z "$remote" ]; then
          echo "==> Branch {{.BRANCH}} is not on origin, so ArgoCD cannot sync it."
          echo "    Push it first: git push -u origin {{.BRANCH}}"
          exit 1
        fi
        if [ "$remote" != "$(git rev-parse HEAD)" ]; then
          echo "==> WARNING: origin/{{.BRANCH}} is at ${remote:0:7}, your HEAD is at $(git rev-parse --short HEAD). ArgoCD syncs origin."
        fi
        if ! git diff --quiet HEAD; then
          echo "==> WARNING: uncommitted changes. ArgoCD only sees what is committed and pushed."
        fi
      - |
        echo "==> Applying {{.ROOT_APP}} with targetRevision {{.BRANCH}}"
        # The file in git targets main (what EC2 runs). Swap its one
        # targetRevision for the current branch; the root passes it on to
        # every child (docs/adr/0005-one-revision-for-app-of-apps.md).
        manifest=$(sed -E 's#^( *targetRevision:).*#\1 {{.BRANCH}}#' {{.ROOT_APP}})
        # Guard against the sed silently matching nothing.
        if ! echo "$manifest" | grep -q "targetRevision: {{.BRANCH}}$"; then
          echo "==> Could not set targetRevision in {{.ROOT_APP}}."
          exit 1
        fi
        echo "$manifest" | kubectl --context {{.KCTX}} apply -f -

  argocd:ui:
    desc: Open the ArgoCD UI on http://localhost:8080 (port-forward; Ctrl+C to stop)
    cmds:
      - echo "==> ArgoCD UI at http://localhost:8080 (user admin). Ctrl+C stops the port-forward."
      # The password is a Secret; this prints the command, never the value.
      # `argocd admin` reads the Secret through the current kubectl context.
      - echo "    Password    argocd admin initial-password -n {{.ARGOCD_NAMESPACE}}"
      - echo "    Then change it in the UI (User Info, Update Password) and delete the initial one:"
      - echo "                kubectl --context {{.KCTX}} -n {{.ARGOCD_NAMESPACE}} delete secret argocd-initial-admin-secret"
      # Port 80: argocd-server serves plain HTTP (server.insecure in
      # platform/bootstrap/argocd-values.yaml).
      - kubectl --context {{.KCTX}} -n {{.ARGOCD_NAMESPACE}} port-forward svc/argocd-server 8080:80

  argocd:status:
    desc: List ArgoCD Applications with their sync wave, sync status, health and revisions
    cmds:
      # custom-columns picks fields from each Application. Dots in the
      # annotation name are escaped with a backslash. A single-source app
      # reports .status.sync.revision; one with several sources (demo:
      # chart + values) reports a list in .status.sync.revisions instead.
      - >-
        kubectl --context {{.KCTX}} -n {{.ARGOCD_NAMESPACE}} get applications.argoproj.io
        -o custom-columns='NAME:.metadata.name,WAVE:.metadata.annotations.argocd\.argoproj\.io/sync-wave,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision,MULTI-SOURCE REVISIONS:.status.sync.revisions'

  build:
    desc: Build every service image and push it to the local k3d registry
    preconditions:
      - sh: curl -sf -o /dev/null http://{{.REGISTRY}}/v2/
        msg: "Registry {{.REGISTRY}} is not reachable. Run task dev:up first."
    cmds:
      - |
        built=0
        for dockerfile in services/*/Dockerfile; do
          # Without a match the glob stays literal; skip it.
          [ -f "$dockerfile" ] || continue
          dir=$(dirname "$dockerfile")
          image="{{.REGISTRY}}/sizjobs-$(basename "$dir")"
          echo "==> Building $image:{{.TAG}} from $dir"
          # The extra :dev tag always points at the latest local build, for
          # manifests that do not pin a commit.
          docker build -t "$image:{{.TAG}}" -t "$image:dev" "$dir"
          echo "==> Pushing $image:{{.TAG}} and $image:dev"
          docker push --quiet "$image:{{.TAG}}"
          docker push --quiet "$image:dev"
          built=$((built + 1))
        done
        if [ "$built" -eq 0 ]; then
          echo "==> No services/*/Dockerfile yet, nothing to build."
        else
          echo "==> Built and pushed $built image(s) with tag {{.TAG}}."
        fi

  secrets:
    desc: Create or update Kubernetes Secrets from ~/.config/sizjobs/.env (DRY_RUN=1 lists names only)
    # The values never pass through Task: the script reads the file itself.
    # Which Secret gets which keys is in config/secrets-map.yaml.
    preconditions:
      - sh: test -f "$HOME/.config/sizjobs/.env"
        msg: "~/.config/sizjobs/.env not found. Create it: mkdir -p ~/.config/sizjobs && install -m 600 .env.example ~/.config/sizjobs/.env"
      # Both print the permission bits in octal; 600 means only you can
      # read or write the file. `stat -c %a` is GNU (Linux); macOS's BSD
      # stat spells it `stat -f %Lp` (%Lp: the low permission bits only).
      - sh: test "$(stat -c %a "$HOME/.config/sizjobs/.env" 2>/dev/null || stat -f %Lp "$HOME/.config/sizjobs/.env")" = 600
        msg: "~/.config/sizjobs/.env must be mode 600 (only you can read it). Fix: chmod 600 ~/.config/sizjobs/.env"
    env:
      DRY_RUN: "{{.DRY_RUN}}"
    cmds:
      - echo "==> {{if eq .DRY_RUN "1"}}Listing{{else}}Applying{{end}} Secrets from ~/.config/sizjobs/.env using config/secrets-map.yaml"
      # uv run --script installs the script's own pinned dependency (PyYAML)
      # into a cached throwaway environment; see the header of the script.
      - >-
        uv run --quiet --script scripts/secrets_to_k8s.py
        --env-file "$HOME/.config/sizjobs/.env"
        --map config/secrets-map.yaml
        --context {{.KCTX}}

  # The LLM gateway (a3-1): LiteLLM in namespace llm, from platform/litellm.
  # README.md "AI gateway" explains models, keys and budgets. The tasks that
  # need the master key (llm:key, llm:spend, the DB query in llm:health)
  # read it from the .env themselves (scripts/litellm_admin.py); it never
  # passes through Task, arguments or output.

  llm:verify-image:
    desc: Verify the cosign signatures of the pinned LiteLLM image (by digest) and Helm chart against LiteLLM's key at a fixed commit
    cmds:
      - |
        # Image and chart exactly as git pins them. VALUE_AWK prints `key`
        # from the top-level `block` of a values file.
        block=image key=repository; repo=$({{.PG_VALUE_AWK}} {{.LLM_VALUES}})
        block=image key=tag; tag=$({{.PG_VALUE_AWK}} {{.LLM_VALUES}})
        version=${tag%%@*}
        digest=${tag#*@}
        # targetRevision on the line after "chart: litellm-helm".
        chart_version=$(awk '/chart: litellm-helm/ {f=1; next} f && $1 == "targetRevision:" {print $2; exit}' {{.LLM_APP}})
        echo "==> Pinned in git: image $repo $version, digest $digest; chart {{.LLM_CHART}} $chart_version"
        case "$digest" in
          sha256:*) ;;
          *) echo "==> FAIL: image.tag in {{.LLM_VALUES}} has no @sha256 digest. Pin by digest."; exit 1 ;;
        esac
        # The compromised release (2026-10-21). Its images carry a valid
        # signature from the old key, so a signature check alone would not
        # catch it.
        if [ "$version" = v1.107.0 ] || [ "$chart_version" = 1.107.0 ]; then
          echo "==> FAIL: 1.107.0 is the compromised LiteLLM release. Never use it."
          exit 1
        fi

        echo "==> Fetching LiteLLM's public key from commit e82a3c6 and checking its fingerprint"
        keyfile=$(mktemp)
        trap 'rm -f "$keyfile"' EXIT
        curl -fsSL -o "$keyfile" {{.LITELLM_COSIGN_KEY_URL}}
        fingerprint=$(sha256sum "$keyfile" | cut -d' ' -f1)
        if [ "$fingerprint" != {{.LITELLM_COSIGN_FINGERPRINT}} ]; then
          echo "==> FAIL: key fingerprint $fingerprint, expected {{.LITELLM_COSIGN_FINGERPRINT}}"
          exit 1
        fi
        echo "    PASS  fingerprint $fingerprint matches the incident post"

        # cosign verify checks that a signature made with this key exists
        # for exactly this digest, and that it is recorded in the Rekor
        # transparency log. Its JSON output (the signed payload) goes to
        # /dev/null; the checks it performed go to stderr.
        echo "==> Verifying the image signature: $repo@$digest"
        cosign verify --key "$keyfile" "$repo@$digest" >/dev/null 2>"$keyfile.log" \
          && echo "    PASS  image signature" || { cat "$keyfile.log"; rm -f "$keyfile.log"; echo "==> FAIL: image signature"; exit 1; }
        sed -n 's/^  - /          /p' "$keyfile.log"; rm -f "$keyfile.log"

        echo "==> Verifying the chart signature: {{.LLM_CHART}}:$chart_version"
        cosign verify --key "$keyfile" "{{.LLM_CHART}}:$chart_version" >/dev/null 2>"$keyfile.log" \
          && echo "    PASS  chart signature" || { cat "$keyfile.log"; rm -f "$keyfile.log"; echo "==> FAIL: chart signature"; exit 1; }
        rm -f "$keyfile.log"

        # Informational: does the tag still point at our digest? A moved
        # tag does not affect us (we pull by digest), but it is worth knowing
        # before an upgrade.
        echo "==> Checking where tag $version points today"
        now=$(docker buildx imagetools inspect "$repo:$version" --format '{{"{{"}}json .Manifest.Digest{{"}}"}}' 2>/dev/null | tr -d '"' || true)
        if [ "$now" = "$digest" ]; then
          echo "    ok    $repo:$version still points at the pinned digest"
        else
          echo "    WARN  $repo:$version now points at ${now:-(could not resolve)}, not the pinned digest. Find out why before any upgrade."
        fi
        echo "==> Verified: image and chart are signed with LiteLLM's current key."

  llm:forward:
    desc: Port-forward the LiteLLM gateway to http://localhost:4000 (admin UI at /ui; Ctrl+C to stop)
    cmds:
      - echo "==> LiteLLM at http://localhost:{{.LLM_PORT}} (svc/{{.LLM_SERVICE}} in namespace {{.LLM_NAMESPACE}}). Ctrl+C stops the port-forward."
      - echo "    Admin UI  http://localhost:{{.LLM_PORT}}/ui  (user admin, password LITELLM_MASTER_KEY from your .env)"
      # port-forward listens on 127.0.0.1 only, so nothing else on the
      # network reaches the gateway. It needs no NetworkPolicy: it enters
      # the pod's network namespace through the kubelet.
      - kubectl --context {{.KCTX}} -n {{.LLM_NAMESPACE}} port-forward svc/{{.LLM_SERVICE}} {{.LLM_PORT}}:4000

  llm:health:
    desc: "Gateway health: pods, liveness, readiness and database connectivity (PASS/FAIL)"
    cmds:
      - echo "==> Checking LiteLLM health (scripts/litellm_admin.py health)"
      - >-
        uv run --quiet --script scripts/litellm_admin.py health
        --context {{.KCTX}} --namespace {{.LLM_NAMESPACE}} --service {{.LLM_SERVICE}}
        --env-file "$HOME/.config/sizjobs/.env"

  llm:key:
    desc: "Create the agent's virtual key (agent-model only, 10 USD per 30 days) and write it to the .env as LITELLM_AGENT_KEY (ROTATE=1 replaces it)"
    preconditions:
      - sh: test -f "$HOME/.config/sizjobs/.env"
        msg: "~/.config/sizjobs/.env not found. See .env.example."
    env:
      ROTATE: "{{.ROTATE}}"
    cmds:
      - echo "==> {{if eq .ROTATE "1"}}Rotating{{else}}Creating{{end}} the agent's LiteLLM key through the admin API (scripts/litellm_admin.py key)"
      - >-
        uv run --quiet --script scripts/litellm_admin.py key
        --context {{.KCTX}} --namespace {{.LLM_NAMESPACE}} --service {{.LLM_SERVICE}}
        --env-file "$HOME/.config/sizjobs/.env"
      - echo "==> Next, push it to Secret agents/llm-key with task secrets."

  llm:spend:
    desc: Show the agent key's spend and budget, and its requests per model
    cmds:
      - echo "==> Reading the agent key's spend from LiteLLM (scripts/litellm_admin.py spend)"
      - >-
        uv run --quiet --script scripts/litellm_admin.py spend
        --context {{.KCTX}} --namespace {{.LLM_NAMESPACE}} --service {{.LLM_SERVICE}}
        --env-file "$HOME/.config/sizjobs/.env"

  llm:smoke:
    desc: "Gateway smoke test from a pod in agents with the agent key: primary, fallback, no key, wrong model, MCP (PASS/FAIL)"
    preconditions:
      - sh: kubectl --context {{.KCTX}} -n agents get secret llm-key >/dev/null 2>&1
        msg: "Secret agents/llm-key not found. Run task llm:key, then task secrets."
    cmds:
      - |
        k() { kubectl --context {{.KCTX}} -n agents "$@"; }
        pod="llm-smoke-$(date +%s)"
        echo "==> Starting pod $pod in namespace agents, with LITELLM_AGENT_KEY from Secret llm-key"
        echo "    Its label app.kubernetes.io/name=llm-smoke is one of the two the NetworkPolicies let reach"
        echo "    LiteLLM (llm-clients in agents, litellm in llm): it calls the gateway as the agent will."
        trap 'echo "==> Deleting pod $pod"; k delete pod "$pod" --ignore-not-found --wait=false >/dev/null 2>&1' EXIT
        # Quoted 'EOF': $vars below belong to the pod's shell; sed fills in
        # the pod name. The key reaches curl through stdin (curl -K -, a
        # config file on stdin), never as an argument, and is never printed.
        sed "s/POD_NAME/$pod/" <<'EOF' | k create -f - >/dev/null
        apiVersion: v1
        kind: Pod
        metadata:
          name: POD_NAME
          labels:
            app.kubernetes.io/name: llm-smoke
            app.kubernetes.io/managed-by: sizjobs-task-llm-smoke
        spec:
          restartPolicy: Never
          activeDeadlineSeconds: 120
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: smoke
              image: {{.CURL_IMAGE}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  url=http://{{.LLM_SERVICE}}.{{.LLM_NAMESPACE}}.svc.cluster.local:{{.LLM_PORT}}
                  result=PASS
                  report() { printf '    %-4s  %s\n' "$1" "$2"; [ "$1" = PASS ] || result=FAIL; }
                  # post PATH BODY [nokey]: prints the HTTP status. The body
                  # goes to /tmp/body, curl's own error (-sS: silent, but
                  # still show errors) to /tmp/err, its exit code to
                  # /tmp/rc. Without a response (HTTP 000) curl writes no
                  # body file, so clear all three first.
                  post() {
                    : > /tmp/body; : > /tmp/err
                    if [ "$3" = nokey ]; then
                      curl -sS -m 30 -o /tmp/body -w '%{http_code}' -H 'Content-Type: application/json' -d "$2" "$url$1" 2>/tmp/err
                    else
                      printf 'header = "Authorization: Bearer %s"\n' "$LITELLM_AGENT_KEY" \
                        | curl -sS -m 30 -K - -o /tmp/body -w '%{http_code}' -H 'Content-Type: application/json' -d "$2" "$url$1" 2>/tmp/err
                    fi
                    echo $? > /tmp/rc
                  }
                  ask() { printf '{"model":"%s","messages":[{"role":"user","content":"ping"}]%s}' "$1" "$2"; }
                  # What went wrong, for a FAIL line: curl's exit code and
                  # error when it got no answer, otherwise the start of
                  # LiteLLM's answer. Not secret, but an error body could
                  # echo part of a key, so mask sk-... too.
                  short() {
                    rc=$(cat /tmp/rc)
                    if [ "$rc" != 0 ]; then
                      echo "curl exit $rc: $(tr -d '\n' < /tmp/err)"
                    else
                      tr -d '\n' < /tmp/body | sed 's/sk-[A-Za-z0-9_-]*/sk-***/g' | cut -c1-160
                    fi
                  }

                  # A new pod's traffic is dropped for its first second or
                  # so: kube-router (k3s's NetworkPolicy engine) has to add
                  # the pod's IP to the allow rules for its labels first, and
                  # until then default-deny wins (curl exit 7, HTTP 000).
                  # Wait for the gateway to answer before any check counts.
                  echo "==> Waiting until the NetworkPolicies let this pod reach $url (up to 30s)"
                  for i in $(seq 1 30); do
                    code=$(curl -sS -m 3 -o /dev/null -w '%{http_code}' "$url/health/liveliness" 2>/tmp/err) && break
                    sleep 1
                  done
                  if [ "$code" != 200 ]; then
                    echo "    FAIL  gateway not reachable after 30s: HTTP $code, $(tr -d '\n' < /tmp/err)"
                    echo "==> LLM smoke test: FAIL"
                    exit 1
                  fi
                  echo "    ok    /health/liveliness answers 200 after ${i}s"

                  echo "==> (a) agent-model, expect the primary's mock text"
                  code=$(post /v1/chat/completions "$(ask agent-model)")
                  if [ "$code" = 200 ] && grep -q 'MOCK PRIMARY' /tmp/body; then report PASS "HTTP 200, MOCK PRIMARY"; else report FAIL "HTTP $code: $(short)"; fi

                  echo "==> (b) agent-model with mock_testing_fallbacks, expect the backup's mock text"
                  # mock_testing_fallbacks makes the router fail the primary
                  # (after its retries), so the fallback answers.
                  code=$(post /v1/chat/completions "$(ask agent-model ',"mock_testing_fallbacks":true')")
                  if [ "$code" = 200 ] && grep -q 'MOCK BACKUP' /tmp/body; then report PASS "HTTP 200, MOCK BACKUP"; else report FAIL "HTTP $code: $(short)"; fi

                  echo "==> (c) agent-model without a key, expect 401"
                  code=$(post /v1/chat/completions "$(ask agent-model)" nokey)
                  if [ "$code" = 401 ]; then report PASS "HTTP 401"; else report FAIL "HTTP $code: $(short)"; fi

                  echo "==> (d) agent-model-primary directly, a model the key is not allowed, expect a rejection"
                  code=$(post /v1/chat/completions "$(ask agent-model-primary)")
                  case "$code" in
                    401|403) report PASS "HTTP $code: $(short)" ;;
                    *) report FAIL "HTTP $code: $(short)" ;;
                  esac

                  echo "==> (e) the MCP gateway (POST /mcp/) with the agent key, expect a rejection"
                  code=$(post /mcp/ '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
                  case "$code" in
                    401|403|404) report PASS "HTTP $code" ;;
                    *) report FAIL "HTTP $code: $(short)" ;;
                  esac

                  echo "==> LLM smoke test: $result"
                  [ "$result" = PASS ]
              env:
                - name: LITELLM_AGENT_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-key
                      key: LITELLM_AGENT_KEY
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Mi
        EOF
        echo "==> Waiting for the checks to finish"
        for i in $(seq 1 60); do
          phase=$(k get pod "$pod" -o jsonpath='{.status.phase}' 2>/dev/null || true)
          case "$phase" in Succeeded|Failed) break ;; esac
          sleep 2
        done
        k logs "$pod"
        [ "$phase" = Succeeded ] || { echo "==> llm:smoke: FAIL (pod phase ${phase:-unknown})"; exit 1; }

  # Local model (a1-9): Ollama on the host, for offline smoke tests.
  # On WSL it is a systemd service installed by Ollama's script, so
  # starting and stopping it needs sudo; on macOS it is a Homebrew service
  # (brew install ollama), which does not. A loaded model holds RAM the
  # cluster needs: run llm:down when you are done.

  llm:up:
    desc: Start the local Ollama service and wait until its API answers
    cmds:
      - |
        if [ "$(uname -s)" = Darwin ]; then
          # macOS: Homebrew's ollama formula runs as a per-user launchd
          # service, so no sudo. `brew services start` is a no-op when it
          # is already running.
          echo "==> Starting Ollama (brew services start ollama)"
          brew services start ollama
        elif systemctl is-active --quiet ollama; then
          echo "==> Ollama is already running"
        else
          echo "==> Starting Ollama (sudo systemctl start ollama)"
          sudo systemctl start ollama
        fi
      - |
        echo "==> Waiting for the Ollama API on localhost:11434"
        for i in $(seq 1 30); do
          # /api/version is Ollama's cheapest endpoint; -f fails on HTTP errors.
          if curl -sf -o /dev/null http://localhost:11434/api/version; then
            echo "==> Ollama is up. Models: $(ollama list | tail -n +2 | awk '{print $1}' | paste -sd ' ' -)"
            exit 0
          fi
          sleep 1
        done
        if [ "$(uname -s)" = Darwin ]; then
          echo "==> Ollama did not answer within 30s. Logs: $(brew --prefix)/var/log/ollama.log"
        else
          echo "==> Ollama did not answer within 30s. Logs: journalctl -u ollama -n 50"
        fi
        exit 1

  llm:down:
    desc: Stop the local Ollama service to free its RAM
    cmds:
      - |
        if [ "$(uname -s)" = Darwin ]; then
          echo "==> Stopping Ollama (brew services stop ollama)"
          brew services stop ollama
        else
          echo "==> Stopping Ollama (sudo systemctl stop ollama)"
          sudo systemctl stop ollama
        fi
      - echo "==> Stopped."

  smoke:
    desc: "Smoke-test the LLM endpoint: models list, then one tool call (LLM_BASE_URL, LLM_MODEL)"
    cmds:
      - echo "==> Running scripts/smoke_llm.py"
      # uv run --script installs the script's pinned openai SDK into a
      # cached environment; LLM_* variables pass through from your shell.
      - uv run --quiet --script scripts/smoke_llm.py

  run:
    desc: Run the agent once as a Kubernetes Job and follow its logs (a4-6)
    cmds:
      - echo "==> run is not implemented yet. See issue a4-6."
      - exit 1

  eval:
    desc: Run the promptfoo evals in evals/ against the golden dataset (a7-2)
    cmds:
      - echo "==> eval is not implemented yet. See issue a7-2."
      - exit 1

  # ---------------------------------------------------------------------------
  # Part B: AWS. Terraform never runs from the laptop; these will trigger
  # the GitHub Actions workflows that do.
  # ---------------------------------------------------------------------------

  up:
    desc: "Part B: bring up the AWS environment through the env-up workflow (b3-2)"
    cmds:
      - echo "==> up is a Part B placeholder. It will trigger the env-up workflow (b3-2); it never runs terraform locally."
      - exit 1

  down:
    desc: "Part B: tear down the AWS environment through the env-down workflow"
    cmds:
      - echo "==> down is a Part B placeholder. It will trigger the env-down workflow; it never runs terraform locally."
      - exit 1
