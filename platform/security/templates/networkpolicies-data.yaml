# it next to LiteLLM in the pg-instances ingress rule above, as another item
# under from:, and an egress rule to the jobs pods on 5432 in
# networkpolicies-agents.yaml (see the litellm policy in
# networkpolicies-llm.yaml for the shape).
#
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: agents
#           podSelector:
#             matchLabels:
#               app.kubernetes.io/name: agent
