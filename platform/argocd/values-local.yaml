# Helm values for ArgoCD on the local k3d cluster, installed by `task dev:up`.
# Chart: argo-cd from https://argoproj.github.io/argo-helm (version pinned in
# Taskfile.yml). The full list of values is in the chart's values.yaml.
#
# Goal: the smallest ArgoCD that still has the UI. WSL has 10GB for
# everything, so components we do not use are off, and every container has
# memory requests and limits.

# Dex is the bundled SSO server. We log in as the local admin user.
dex:
  enabled: false

# Notifications (Slack, email on sync events). Not needed; alerts come later.
notifications:
  enabled: false

# The ApplicationSet controller generates Applications from templates.
# The app-of-apps pattern uses plain Applications, so run zero replicas.
applicationSet:
  replicas: 0
  # Set anyway, so scaling it up later cannot run it unbounded.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

# Reconciles Applications against the cluster. The largest component.
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Clones the repo and renders Helm charts into manifests.
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  # Init container that copies the argocd binary into the pod.
  copyutil:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

# API and web UI.
server:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 192Mi

# Cache for rendered manifests and cluster state.
redis:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 96Mi

# One-off Job that generates the Redis password Secret.
redisSecretInit:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# No CPU limits anywhere: a CPU limit throttles a pod even when the node is
# idle, which mostly slows syncs down. Memory limits are what protect WSL.
