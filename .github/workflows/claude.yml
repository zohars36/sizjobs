name: Claude Code

on:
  # zizmor flags issue_comment because anyone can comment on a public
  # repo. Mitigated: the job only starts for the owner and collaborators
  # (author_association below), and the action itself rejects users
  # without write access. It never checks out untrusted PR code.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Start a runner only when @claude is mentioned by the owner or a
    # collaborator, so strangers cannot spend runner minutes or quota.
    # The action also rejects anyone without write access to the repo.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only on purpose: Claude writes through the Claude GitHub App token,
    # obtained with id-token, not through this workflow's GITHUB_TOKEN.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        # Pinned to a commit SHA (tags can be moved); Renovate bumps it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Do not leave GITHUB_TOKEN in .git/config. The action sets up its
          # own git credentials from the Claude GitHub App token.
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Cap each run so a stuck task can't burn the subscription quota
          claude_args: "--max-turns 15"

          # Lets Claude read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional custom prompt; without it Claude follows the @claude comment
          # prompt: '...'
          # Options: https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
