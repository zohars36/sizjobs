# k3d cluster for Part A: k3s in Docker on the WSL laptop.
# Used by `task dev:up`:  k3d cluster create sizjobs --config k3d/sizjobs.yaml
# Schema: https://k3d.io/stable/usage/configfile/
# Design notes: docs/adr/0004-local-k3d-cluster.md
#
# k3d does not expand "~", but it does expand environment variables like
# ${HOME} in this file, so paths below use ${HOME}. Because of that, do not
# write a dollar sign anywhere else in this file, comments included.
#
# Image reference for local builds (works for `docker push` on the laptop
# AND for pods in the cluster, no rewriting needed):
#
#     localhost:5000/<name>:<tag>      e.g. localhost:5000/sizjobs-agent:dev
#
# See the "registries" section below for how that works.

apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  # Overridden by the name `task dev:up` passes on the command line.
  name: sizjobs

# One server node, no agents. The server also runs workloads; a single node
# matches the single EC2 instance of Part B and keeps memory low.
servers: 1
agents: 0

# k3s v1.36.5. EC2 in Part B runs this same k3s version, so local and AWS
# behave alike. kubectl in .mise.toml tracks it (one minor version of skew
# at most); bump them together. Docker tags use "-k3s1" where the k3s
# release name uses "+k3s1".
image: rancher/k3s:v1.36.5-k3s1

# The Kubernetes API, published on the laptop only (127.0.0.1), on a fixed
# port so the kubeconfig does not change between re-creates.
kubeAPI:
  hostIP: "127.0.0.1"
  hostPort: "6550"

volumes:
  # k3s's built-in local-path provisioner stores every PersistentVolume
  # under /var/lib/rancher/k3s/storage in the node. Mounting a host
  # directory there puts PVC data on the WSL disk, so it is still there
  # after `k3d cluster delete`. `task dev:up` creates the directory first,
  # so it is owned by you rather than by root.
  - volume: ${HOME}/.local/share/sizjobs/storage:/var/lib/rancher/k3s/storage
    nodeFilters:
      - server:0

registries:
  # A plain Docker registry next to the cluster, for quick branch builds
  # (`task build`). Images from main come from GHCR instead.
  create:
    # Container name, also its hostname on the k3d Docker network.
    name: registry.localhost
    # Published on the laptop only, so nothing else on the LAN can push.
    host: "127.0.0.1"
    # The host side of the port: the laptop pushes to localhost:5000.
    # Docker allows plain HTTP to localhost without "insecure-registries".
    hostPort: "5000"
    volumes:
      # Keep pushed images across cluster re-creates.
      - ${HOME}/.local/share/sizjobs/registry:/var/lib/registry
  # Written to /etc/rancher/k3s/registries.yaml in the node: tells k3s's
  # containerd where to pull images from. Inside the node, "localhost" is
  # the node itself, where no registry listens. This mirror sends pulls for
  # "localhost:5000/..." to the registry container over the k3d Docker
  # network instead, so manifests use the same name the laptop pushes to.
  config: |
    mirrors:
      "localhost:5000":
        endpoint:
          - http://registry.localhost:5000

options:
  k3d:
    # Wait for the server to be ready before `cluster create` returns.
    wait: true
    # k3d normally puts an nginx load balancer container in front of the
    # servers, so the API and published ports survive one server going
    # down. With a single server there is nothing to balance: it would only
    # cost a container and some memory. Without it, the API port above is
    # published straight from the server node.
    disableLoadbalancer: true
  k3s:
    extraArgs:
      # Traefik is k3s's bundled ingress controller. We use
      # kubectl port-forward locally and no ingress at all, so turn it off
      # to save memory. The other bundled add-ons stay: metrics-server (for
      # `kubectl top` and `task dev:status`) and local-path (PVCs, above).
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  runtime:
    # Docker memory limit on the server node container: the whole cluster
    # (k3s itself plus every pod) gets at most 7 GiB of the 10 GB WSL has,
    # leaving about 3 GB for Docker, the VS Code server and the agent's
    # browser. k3d also mounts a matching /proc/meminfo into the node, so
    # the kubelet reports 7 GiB of capacity and schedules against it
    # instead of seeing all of WSL.
    serversMemory: "7g"
  kubeconfig:
    # Add the k3d-sizjobs context to ~/.kube/config and switch to it.
    updateDefaultKubeconfig: true
    switchCurrentContext: true
