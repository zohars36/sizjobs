# Which Kubernetes Secret holds which keys, and in which namespace.
# Names only, never values: this file is public.
#
# One map, two producers, the same Secrets:
#   Part A: `task secrets` reads ~/.config/sizjobs/.env and creates them.
#   Part B: ExternalSecrets generated from this map read SSM parameters
#           /sizjobs/<secret name>/<KEY> and create them.
# Workloads therefore never change between laptop and AWS. Each key keeps
# its env var name inside the Secret, so a pod can load a whole Secret with
# envFrom.secretRef.
#
# Fields of an entry:
#   name, namespace  where the Secret goes.
#   keys             .env keys to copy. A plain name keeps its name in the
#                    Secret; "SECRET_KEY: ENV_KEY" stores the value of ENV_KEY
#                    under SECRET_KEY, for consumers that expect fixed key
#                    names (basic-auth wants username and password).
#   type             optional Secret type, default Opaque.
#   literals         optional fixed, non-secret entries, written as given.
#                    They do not count as values: a Secret with literals but
#                    no .env value is still skipped.
#   labels           optional labels on the Secret.
#
# Namespaces (created by a2-5 with Pod Security "restricted" and
# default-deny NetworkPolicies; `task secrets` creates them if missing):
#   data        stateful services: SeaweedFS (S3) and Postgres (CNPG) next
#               to it, so CNPG backups read the s3 Secret in their own
#               namespace.
#   llm         the LiteLLM gateway, the only holder of model credentials
#               and of tracing keys (the Langfuse callback runs in LiteLLM).
#   agents      the agent Job: reads mail, sends the digest. It gets an
#               LLM key from LiteLLM, never the provider credentials.
#   monitoring  Grafana Alloy, shipping metrics and logs to Grafana Cloud.
# A Secret is only readable in its own namespace, so this split keeps,
# say, a compromised agent pod away from the Bedrock and S3 keys.
# If two namespaces need the same keys, list the Secret twice.

secrets:
  - name: s3
    namespace: data
    keys: [S3_ACCESS_KEY, S3_SECRET_KEY]

  # Postgres role passwords (a2-4), one Secret per role, read by CNPG to
  # set the password of the managed role (platform/postgres). CNPG wants
  # type basic-auth with the role name as username. cnpg.io/reload makes
  # it apply a changed password at once instead of at its next resync.
  # The apps that log in (LiteLLM in llm, the agent in agents) get their
  # own copy in their namespace when they arrive (a3, a4).
  - name: pg-agent
    namespace: data
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
    literals:
      username: agent
    keys:
      - password: PG_AGENT_PASSWORD

  - name: pg-litellm
    namespace: data
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
    literals:
      username: litellm
    keys:
      - password: PG_LITELLM_PASSWORD

  - name: llm
    namespace: llm
    keys: [LITELLM_MASTER_KEY, BEDROCK_AWS_ACCESS_KEY_ID, BEDROCK_AWS_SECRET_ACCESS_KEY]

  - name: gmail
    namespace: agents
    keys: [GMAIL_ADDRESS, GMAIL_APP_PASSWORD]

  - name: telegram
    namespace: agents
    keys: [TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID]

  - name: langfuse
    namespace: llm
    keys: [LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LANGFUSE_HOST]

  - name: grafana
    namespace: monitoring
    keys:
      - GRAFANA_CLOUD_PROMETHEUS_URL
      - GRAFANA_CLOUD_PROMETHEUS_USER
      - GRAFANA_CLOUD_LOKI_URL
      - GRAFANA_CLOUD_LOKI_USER
      - GRAFANA_CLOUD_TOKEN
